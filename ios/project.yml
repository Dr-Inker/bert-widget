name: BERTWidget
options:
  bundleIdPrefix: global.bert
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    BERT_API_BASE_URL: "http://127.0.0.1:8787"
targets:
  BERTApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.bert.widget
        CODE_SIGN_ENTITLEMENTS: App/BERTApp.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BERT
        UILaunchScreen: {}
        BERT_API_BASE_URL: $(BERT_API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLName: global.bert.widget
            CFBundleURLSchemes:
              - bertwidget
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: BERTWidgetExtension
        embed: true
  BERTWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: global.bert.widget.extension
        CODE_SIGN_ENTITLEMENTS: Widget/BERTWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: BERT Widget
        BERT_API_BASE_URL: $(BERT_API_BASE_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
