# Add inside the berthalla.io TLS server block.
# BERT app landing page; legacy assets, downloads and APIs stay compatible.
location = /app { return 301 /app/$is_args$args; }
location = /widget { return 301 /app/$is_args$args; }
location = /widget/ { return 301 /app/$is_args$args; }
location = /widget/index.html { return 301 /app/$is_args$args; }

location ^~ /app/ {
    include /etc/nginx/snippets/bert-widget-security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

location ^~ /widget/ {
    include /etc/nginx/snippets/bert-widget-security.conf;
    try_files $uri $uri/ =404;
}

location ^~ /widget/download/ {
    include /etc/nginx/snippets/bert-widget-security.conf;
    types { application/vnd.android.package-archive apk; }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

location = /widget/api/quote {
    include /etc/nginx/snippets/bert-widget-security.conf;
    limit_req zone=bert_widget_quote burst=15 nodelay;
    limit_conn bert_widget_quote_conn 5;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8787/v1/bert/quote;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# The service sets Cache-Control on every API response (cacheable 200s, no-store errors); adding it here
# would send the header twice and make 503s cacheable.
# 24-hour price history (5-minute closes).
location = /widget/api/history {
    include /etc/nginx/snippets/bert-widget-security.conf;
    limit_req zone=bert_widget_quote burst=15 nodelay;
    limit_conn bert_widget_quote_conn 5;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8787/v1/bert/history;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
}

# Compatibility route used by Android v0.1.0.
location = /widget/v1/bert/quote {
    include /etc/nginx/snippets/bert-widget-security.conf;
    limit_req zone=bert_widget_quote burst=15 nodelay;
    limit_conn bert_widget_quote_conn 5;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8787/v1/bert/quote;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
