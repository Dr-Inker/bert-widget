# Add inside the berthalla.io TLS server block.
location = /widget { return 301 /widget/; }

location ^~ /widget/ {
    include /etc/nginx/snippets/bert-widget-security.conf;
    try_files $uri $uri/ =404;
}

location = /widget/api/quote {
    include /etc/nginx/snippets/bert-widget-security.conf;
    proxy_pass http://127.0.0.1:8787/v1/bert/quote;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "public, max-age=30, stale-if-error=300" always;
}

# Compatibility route used by Android v0.1.0.
location = /widget/v1/bert/quote {
    include /etc/nginx/snippets/bert-widget-security.conf;
    proxy_pass http://127.0.0.1:8787/v1/bert/quote;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    add_header Cache-Control "public, max-age=30, stale-if-error=300" always;
}

location = /widget/download/bert-widget.apk {
    include /etc/nginx/snippets/bert-widget-security.conf;
    alias /opt/berthalla/website/widget/download/bert-widget.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="berthalla-bert-widget-0.1.0.apk"';
    add_header Cache-Control "public, max-age=3600";
}
